<!DOCTYPE html>
<html>
    <head>
        <title>CTCT High School</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
        <link href="stylesheets/style.css" rel="stylesheet">
        <link href="stylesheets/header.css" rel="stylesheet">
        <link href="stylesheets/homepage.css" rel="stylesheet">

    </head>
    <body>
        <div class="container-fluid">
            <div class="row" id ="topbar">
                <div class="row">
                    <div class="nopad col-lg-9">
                        <div class="ribbon" id="ribbon-small"></div>
                        <div id="padded-header">
                            <img src="CTCT-LOGO_header.png" alt="Carrer Technical & Center Trumbull School Logo" id="ctct-logo">
                        </div>
                    </div>
                    <div class="nopad col-lg-3">
                        <div class="ribbon flex-center" id="ribbon-large">
                            <a class="header-links">Programs</a>
                            <a class="header-links">Contact</a>
                        </div>
                        <div class="flex-center">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="#008f8f" class="bi bi-list" viewBox="0 0 16 16">
                                <path fill-rule="evenodd" d="M2.5 12a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5"/>
                            </svg>
                            <a id="menu-button">Menu</a>
                        </div>
                    </div>
                </div>
               
            </div>

            <div class="row">
                <div class="carousel" id="homepage-carousel">
                    <div class="carousel-inner">
                        <div class="carousel-item active">
                            <img src="ctct-jumboimage1.png" alt="Photo of the Carrer Technical & Center Trumbull High School Building" height="500px" width="100%">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
